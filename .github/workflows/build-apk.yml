name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Siapkan scaffold Android
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --org com.minimal --project-name minimal_launcher .
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart
          rm -rf test

      - name: Jadikan aplikasi sebagai launcher (HOME)
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          launcher = '<category android:name="android.intent.category.LAUNCHER"/>'
          assert launcher in s, 'Kategori LAUNCHER tidak ditemukan di manifest'
          extra = (
              '\n                <category android:name="android.intent.category.HOME"/>'
              '\n                <category android:name="android.intent.category.DEFAULT"/>'
          )
          s = s.replace(launcher, launcher + extra, 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Minimal Launcher"', s, count=1)
          p.write_text(s)
          PY

      - name: Ambil dependensi
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Ganti nama APK
        run: cp build/app/outputs/flutter-apk/app-release.apk MinimalLauncher-0.200.1.apk

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: MinimalLauncher-apk
          path: MinimalLauncher-0.200.1.apk

      - name: Rilis di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.200.1-build${{ github.run_number }}
          name: Minimal Launcher 0.200.1 (build ${{ github.run_number }})
          files: MinimalLauncher-0.200.1.apk
